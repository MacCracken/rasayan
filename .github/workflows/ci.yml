name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — the release-integrity hardening item)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # --locked: the resolution must match the committed cyrius.lock.
        run: cyrius deps --locked

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test

      - name: Test (bounds-checked)
        run: cyrius test --bounds

      - name: Bench
        run: cyrius bench

      - name: Audit (fmt, lint, docs, tests, bench)
        # Not piped: the step must see audit's own exit status.
        run: cyrius audit

      - name: Bundle current ([lib], from M0 part 2c-2)
        # dist/ is generated and committed: it must be what `cyrius distlib --all` writes now.
        run: cyrius distlib --check

  oracle:
    name: Rust oracle (rust-old/, frozen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Oracle builds and passes against its committed lockfile
        run: cargo test --manifest-path rust-old/Cargo.toml --all-features --locked
