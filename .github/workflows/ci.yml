name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — the release-integrity hardening item)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # --locked: the resolution must match the committed cyrius.lock.
        run: cyrius deps --locked

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test

      - name: Test (bounds-checked)
        run: cyrius test --bounds

      - name: Bench
        run: cyrius bench

      - name: Audit (fmt, lint, docs, tests, bench)
        # Not piped: the step must see audit's own exit status.
        run: cyrius audit

      - name: Bundles current ([lib], [lib.mcp], [lib.ai], [lib.full])
        # dist/ is generated and committed: it must be what `cyrius distlib --all` writes now.
        run: cyrius distlib --check

  reference:
    # The golden corpus against its accurate models (ADR 0005): Python and MPFR, no Rust toolchain. rust-old/ and
    # hoosh 1.3's client.rs are read as text, never built or run.
    name: Reference (Python + MPFR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install MPFR
        run: sudo apt-get update && sudo apt-get install -y libmpfr6

      - name: hoosh 1.3.0's source, as text
        # gen.py's ai_client rows read hoosh 1.3's client.rs from the cargo registry's layout. The crate is fetched and
        # unpacked only: its sha256 is the one crates.io's index publishes for 1.3.0.
        run: |
          set -e
          curl -sSfL -o hoosh-1.3.0.crate https://static.crates.io/crates/hoosh/hoosh-1.3.0.crate
          echo "5572ec30ab2e11be054df3caf1cf8cdcbcc86bc09948d0ac2c158d310cbab7a7  hoosh-1.3.0.crate" | sha256sum -c -
          mkdir -p "$HOME/.cargo/registry/src/ci"
          tar -xzf hoosh-1.3.0.crate -C "$HOME/.cargo/registry/src/ci"

      - name: Generated golden rows and data files current
        run: python3 -I -B scripts/oracle/gen.py --check .

      - name: Every golden row against its accurate model
        run: python3 -I -B scripts/oracle/validate.py .

      - name: Class C and T rows against a second MPFR model
        run: python3 -I -B scripts/oracle/mpfr_ref.py --check .

      - name: src/mathx_data.cyr current
        run: python3 -I -B scripts/oracle/mathx_tables.py --check
