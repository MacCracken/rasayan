[package]
name = "rasayan"
version = "1.2.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
description = "Rasayan — biochemistry engine: enzyme kinetics, metabolic pathways, signal transduction, protein structure, membrane transport"
repository = "https://github.com/MacCracken/rasayan"
readme = "README.md"
documentation = "https://docs.rs/rasayan"
keywords = ["biochemistry", "enzyme", "metabolism", "protein", "biology"]
categories = ["science", "simulation"]
exclude = [".claude/", ".github/", "docs/", "scripts/"]

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0.21", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"], optional = true }
bote = { version = "0.92", default-features = false, optional = true }
hoosh = { version = "1.3", default-features = false, optional = true }
# hoosh 1.3 builds reqwest with `rustls-no-provider` and never installs a crypto
# provider outside its own tests, so `ai` installs ring's (already in the tree via hoosh).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"], optional = true }
serde_json = { version = "1.0.154", optional = true }
tokio = { version = "1.54", features = ["rt"], optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
serde_json = "1.0.154"

[features]
default = ["std"]
std = ["serde/std", "thiserror/std"]
full = ["std", "logging", "mcp", "ai"]
logging = ["dep:tracing-subscriber"]
mcp = ["dep:bote", "dep:serde_json"]
ai = ["dep:hoosh", "dep:rustls", "dep:serde_json", "dep:tokio"]

[[bench]]
name = "benchmarks"
harness = false
