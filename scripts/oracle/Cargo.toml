[package]
name = "rasayan-oracle"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
publish = false
description = "Drives the frozen Rust rasayan 1.2.0 in rust-old/ to write the Cyrius port's golden corpus"
build = "build.rs"
default-run = "oracle"

# The oracle is used by path and never built or edited in place (CLAUDE.md: rust-old/ is
# frozen). Cargo.lock was seeded from rust-old/Cargo.lock before the first build, so every
# shared dependency resolves to the version the oracle was tested with. `full`: everything
# ports (ADR 0001), so the corpus can reach every module — `logging`, `mcp` and `ai` included.
[dependencies]
rasayan = { path = "../../rust-old", features = ["full"] }
# The M0 probe binaries (src/bin/probe_mcp.rs, probe_ai.rs, probe_json.rs) name types of the oracle's own
# dependencies, at exactly the versions and features the oracle resolves them with, so nothing here changes the
# oracle's build: bote 0.92 (JsonRpcRequest/Response, probe 6) and hoosh 1.3 (Message, Role: probe 7) without default
# features, as rust-old/Cargo.toml takes them; serde (its `Serializer` trait: probe 11's leaf recorder; `std`, which
# the oracle's `std` feature already turns on) and serde_json with their defaults (probes 6, 7, 11; no
# `float_roundtrip`, which would unify into the oracle's MCP argument parsing); tokio's `rt` (a current-thread runtime
# drives the async `ai` client in probe 7). All six are already in the lockfile through the oracle.
bote = { version = "=0.92.0", default-features = false }
hoosh = { version = "=1.3.0", default-features = false }
serde = "=1.0.229"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt"] }
# M1 part 2: the `logging` rows build the oracle's own filter (logging.rs's `EnvFilter` statement, compiled verbatim in
# src/v_logging.rs) and ask it which levels each rasayan target gets. tracing and tracing-subscriber as rust-old takes
# them (default features; `env-filter` and `fmt`, which the oracle's `logging` feature turns on), at the locked versions.
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }

[[bin]]
name = "oracle"
path = "src/main.rs"

[profile.release]
# Correctness, not speed: keep overflow checks so a bad grid index fails loudly.
overflow-checks = true
